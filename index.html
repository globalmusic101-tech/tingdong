<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="./tingdong-icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./tingdong-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./tingdong-apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tingdong (听懂)</title>
    <script>
      if (location.protocol === 'https:' && location.hostname === 'tingdong-liart.vercel.app') {
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
        window.va('beforeSend', function (event) {
          try {
            const url = new URL(event.url);
            url.search = '';
            url.hash = '';
            return { ...event, url: url.toString() };
          } catch { return null; }
        });
        const script = document.createElement('script');
        script.defer = true;
        script.src = '/_vercel/insights/script.js';
        document.head.appendChild(script);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
