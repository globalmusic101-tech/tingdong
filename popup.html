<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-dark: rgba(32, 33, 36, 0.9);
      --bg-active: rgba(48, 49, 52, 0.95);
      --border-color: rgba(218, 220, 224, 0.15);
      --text-main: #e8eaed;
      --text-sub: #9aa0a6;
      --accent: #8ab4f8;
      --accent-hover: #aecbfa;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font);
      background: transparent;
      color: var(--text-main);
      overflow: hidden;
      user-select: none;
    }

    .card {
      background: var(--bg-dark);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      box-sizing: border-box;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      height: 100vh;
      transition: background 0.2s;
    }

    .card:active {
      background: var(--bg-active);
    }

    /* Drag handle at the top */
    .drag-handle {
      -webkit-app-region: drag;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
      cursor: move;
    }

    .drag-line {
      width: 36px;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      -webkit-app-region: no-drag;
    }

    .source-text-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-width: 80%;
    }

    .chinese {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .pinyin {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 500;
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      -webkit-app-region: no-drag;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.1);
    }

    .icon-btn.active {
      color: var(--accent);
    }

    .divider {
      border: none;
      height: 1px;
      background: var(--border-color);
      margin: 10px 0;
    }

    .content-body {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
      -webkit-app-region: no-drag;
    }

    /* Scrollbar */
    .content-body::-webkit-scrollbar {
      width: 4px;
    }
    .content-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    .translation-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .translation {
      font-size: 1.05rem;
      color: #ffffff;
      font-weight: 500;
      line-height: 1.4;
    }

    .pos-tag {
      font-size: 0.75rem;
      background: rgba(138, 180, 248, 0.15);
      color: var(--accent);
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .usage-box {
      background: rgba(255, 255, 255, 0.03);
      border-left: 3px solid var(--accent);
      padding: 8px 10px;
      border-radius: 0 6px 6px 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
    }

    .usage-title {
      font-weight: 600;
      color: var(--text-sub);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .usage-example {
      color: var(--text-main);
      font-weight: 500;
      line-height: 1.4;
    }

    .usage-example-ko {
      color: var(--text-sub);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      color: var(--text-sub);
      margin-top: 8px;
      -webkit-app-region: no-drag;
    }

    .badge {
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 6px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="drag-handle">
      <div class="drag-line"></div>
    </div>

    <div class="header">
      <div class="source-text-row">
        <span class="chinese" id="chinese-text">...</span>
        <span class="pinyin" id="pinyin-text">...</span>
      </div>
      <div class="actions">
        <button class="icon-btn" id="speak-btn" title="Play pronunciation">🔊</button>
        <button class="icon-btn" id="copy-btn" title="Copy">📋</button>
        <button class="icon-btn" id="pin-btn" title="Keep on top">📌</button>
        <button class="icon-btn" id="close-btn" title="Close (ESC)">✕</button>
      </div>
    </div>

    <!-- 클립보드 복사 에러 경고 배너 -->
    <div id="copy-warning" style="display: none; font-size: 0.72rem; color: #f28b82; padding: 6px 8px; background: rgba(242, 139, 130, 0.08); border-radius: 6px; margin: 6px 0; -webkit-app-region: no-drag; border: 1px solid rgba(242, 139, 130, 0.15); line-height: 1.35;">
      <span id="warning-text"></span>
      <button id="grant-btn" style="display: none; margin-top: 4px; padding: 2px 6px; background: #f28b82; color: #202124; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 0.7rem;">Open permission settings</button>
    </div>

    <div id="full-content" style="display: none;">
      <div class="divider"></div>
      <div class="content-body">
        <div class="translation-row">
          <span class="translation" id="translation-text">Loading translation…</span>
          <span class="pos-tag" id="pos-tag" style="display: none;">part of speech</span>
        </div>
        <div class="usage-box" id="usage-box" style="display: none;">
          <span class="usage-title">💡 Usage / Example</span>
          <span class="usage-example" id="example-zh"></span>
          <span class="usage-example-ko" id="example-ko"></span>
        </div>
      </div>

      <div class="footer">
        <span id="engine-badge" class="badge">Google Translate</span>
        <span id="dismiss-hint">Press Esc or click outside to close.</span>
      </div>
    </div>
  </div>

  <script type="module" src="/src/popup/popup.ts"></script>
</body>
</html>
